# Project metadata and build configuration.
# See PUBLISHING.md for how to build this package and upload it to PyPI.

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "bmondata"
version = "1.0.7"
description = "Allows retrieval and storage of data on BMON Servers."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "Apache-2.0" }
authors = [
    { name = "Alan Mitchell", email = "tabb99@gmail.com" },
]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: OS Independent",
]
dependencies = [
    "requests>=2.18.4",
    "pandas>=0.23.2",
    "pytz",
    "python-dateutil",
]

[project.urls]
Homepage = "https://github.com/alanmitchell/bmondata"

[tool.hatch.build.targets.wheel]
packages = ["bmondata"]

[tool.hatch.build.targets.sdist]
include = [
    "bmondata",
    "README.md",
    "LICENSE",
    "PUBLISHING.md",
]

# Named index so `uv publish --index testpypi` can be used for a trial upload.
# `explicit = true` keeps it out of dependency resolution.
[[tool.uv.index]]
name = "testpypi"
url = "https://test.pypi.org/simple/"
publish-url = "https://test.pypi.org/legacy/"
explicit = true
